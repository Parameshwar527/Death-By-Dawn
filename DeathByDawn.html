<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Death by Dawn</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
 --bar:44px;--btn:44px;--atk:84px;--ctx:64px;--jbase:130px;--jknob:50px;--zw:55%;--zh:60%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;color:#e8ecf4;font:16px system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal))}
.hidden{display:none!important}
input{font-size:16px;padding:12px;min-height:46px;border-radius:10px;border:1px solid #3a4560;background:#1a2132;color:#fff;width:min(300px,80vw);text-align:center;user-select:text;-webkit-user-select:text;touch-action:manipulation}
button{font-size:16px;min-height:44px;padding:10px 20px;border-radius:10px;border:0;background:#4f7cff;color:#fff;font-weight:600;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.5}button.sec{background:#2b3550}button.bad{background:#c62828}
h1{margin:0;font-size:clamp(22px,7dvh,32px)}
#menu,#lobby{justify-content:flex-start;touch-action:pan-y}
.card{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.row{display:flex;gap:8px;align-items:stretch;justify-content:center}
#joinCode{width:min(170px,44vw)}
#mStatus{min-height:1.2em;text-align:center;max-width:90vw}
#joinHint{text-align:center;max-width:90vw}
#code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:min(15vw,64px);font-weight:800;line-height:1.1;letter-spacing:.14em;padding:8px 8px 8px calc(8px + .14em);min-height:56px;min-width:44px;border:2px dashed #3a4560;border-radius:12px;background:#1a2132;cursor:pointer;touch-action:manipulation;text-align:center}
#code:active{background:#232d45}
.lcard{width:100%;flex-direction:column}
.lA,.lB{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
#plist{display:grid;grid-template-columns:1fr;gap:4px;width:min(340px,92vw);max-height:min(42vh,340px);max-height:min(42dvh,340px);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
.pl{display:flex;align-items:center;gap:6px;padding:3px 8px;min-height:28px;font-size:14px;background:#1a2132;border-radius:6px;min-width:0}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}.tag{font-size:11px;opacity:.7;margin-left:auto;white-space:nowrap}

#backT{position:fixed;z-index:30;top:calc(10px + var(--sat));left:calc(10px + var(--sal));width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;font:800 24px "Courier New",ui-monospace,monospace;text-transform:none;letter-spacing:0;display:flex;align-items:center;justify-content:center}
#infoBtn{position:fixed;z-index:30;top:calc(10px + var(--sat));right:calc(10px + var(--sar));width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;font:italic 800 22px "Courier New",ui-monospace,monospace;text-transform:none;letter-spacing:0;display:flex;align-items:center;justify-content:center}
#info{position:fixed;inset:0;z-index:40;background:rgba(2,3,12,.88);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));touch-action:pan-y}
#info .ibox{width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;background:rgba(5,7,22,.96);border:2px solid #2b3584;box-shadow:0 0 0 2px #04051a,0 0 0 4px #6e1119,0 14px 44px rgba(0,0,0,.7);border-radius:4px;font-family:"Courier New",ui-monospace,monospace}
#info .ihead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2b3584;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
#info .ihead button{min-height:36px;padding:4px 12px;font-size:16px}
#info .ilist{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#info .it{display:flex;gap:12px;align-items:center;padding:8px 10px;background:#0f1433;border-left:3px solid var(--c,#888);border-radius:3px}
#info .itabs{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;flex:none}
#info .itabs button{flex:1 0 auto;min-height:34px;padding:4px 10px;font-size:12px;letter-spacing:.06em;opacity:.65}
#info .itabs button.on{opacity:1;background:#2b3584;border-color:#8c9aff}
#info .sh{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd27a;margin:4px 2px 0}
#info .it .sw{font-size:30px;line-height:1;flex:none;width:44px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 2px}
#info .it .sw.multi{font-size:17px}
#info .it img{width:44px;height:44px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges}
#info .it img.o{width:100px;height:72px;object-fit:contain;image-rendering:auto}
#info .it img.o.px{image-rendering:pixelated;image-rendering:crisp-edges}
#info .it b{display:block;font-size:15px;color:var(--c,#fff);text-transform:uppercase;letter-spacing:.05em}
#info .it span{display:block;font-size:13px;line-height:1.35;color:#c4cbf2;margin-top:2px}
@media (max-height:560px){#code{font-size:36px;min-height:48px}.card{gap:6px}.lA{gap:6px}}
@media (orientation:landscape) and (max-height:520px){
 .lcard{flex-direction:row;align-items:flex-start;justify-content:center;gap:20px}
 .lA{width:min(260px,44%)}.lB{width:min(320px,52%)}
 #plist{width:100%;max-height:calc(100dvh - 32px - var(--sat) - var(--sab))}
 .screen{padding-top:calc(8px + var(--sat));padding-bottom:calc(8px + var(--sab))}
}
small{opacity:.6}
.pl img{width:18px;height:25px;image-rendering:pixelated;flex:none}
/* ---------- game screen ---------- */
#game{display:block;padding:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#game button{touch-action:none;min-width:var(--btn);min-height:var(--btn)}
#topbar{position:absolute;left:0;right:0;top:0;z-index:10;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:8px;height:calc(var(--bar) + var(--sat));padding:var(--sat) calc(var(--sar) + 6px) 0 calc(var(--sal) + 8px);pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
#tbL{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#hud{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:16px;opacity:.9}
#chip{padding:1px 9px;border-radius:999px;font-size:11px;line-height:14px;font-weight:700;letter-spacing:.08em}
#chip.killer{background:#b71c1c;color:#fff}#chip.survivor{background:#e8ecf4;color:#0b0e14}
#cd{justify-self:center;font-size:22px;line-height:28px;font-weight:800;text-shadow:0 2px 10px #000;white-space:nowrap}
#menuBtn{pointer-events:auto;justify-self:end;width:var(--btn);height:var(--btn);padding:0;font-size:22px;border-radius:10px;background:rgba(43,53,80,.88)}
#under{position:absolute;z-index:6;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);top:calc(var(--sat) + var(--bar) + 2px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#stat{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.si{display:inline-flex;align-items:center;gap:3px;padding:1px 5px;background:rgba(0,0,0,.55);border-radius:9px;font-size:11px;line-height:14px}
.si i{width:9px;height:9px;border-radius:50%;display:block}.si b{font-size:11px;min-width:8px;text-align:center}
.si.me{outline:1.5px solid #fff}.si.away{opacity:.45}
#specL{padding:3px 10px;background:rgba(0,0,0,.6);border-radius:12px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{background:#c62828;padding:4px 12px;border-radius:8px;font-size:13px;text-align:center;max-width:100%}
#dbgG{font:11px monospace;opacity:.75;text-align:center;max-width:100%}
#hint{position:absolute;z-index:4;left:calc(var(--sal) + 28px);bottom:calc(var(--sab) + 28px);width:var(--jbase);height:var(--jbase);border-radius:50%;border:2px dashed rgba(255,255,255,.2);background:radial-gradient(circle,rgba(255,255,255,.07) 0 28%,transparent 30%);pointer-events:none;transition:opacity .2s}
#hint.off{opacity:0}
@media (hover:hover) and (pointer:fine){#hint{display:none}}
#base{position:absolute;z-index:4;left:0;top:0;width:var(--jbase);height:var(--jbase);border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);pointer-events:none;opacity:0;transition:opacity .18s;will-change:transform,opacity}
#knob{position:absolute;left:calc(50% - var(--jknob) / 2);top:calc(50% - var(--jknob) / 2);width:var(--jknob);height:var(--jknob);border-radius:50%;background:rgba(255,255,255,.38)}
#zone{position:absolute;left:0;bottom:0;width:var(--zw);height:var(--zh);z-index:5;touch-action:none}
.spectating #zone,.spectating #hint,.spectating #base{display:none}
#acts{position:absolute;z-index:7;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 18px);width:var(--atk);height:calc(var(--atk) + var(--ctx) + 62px + 24px);pointer-events:none}
#acts>button{position:absolute;left:0;right:0;margin:0 auto}   /* fixed slots: attack at the bottom, secondary above it, item on top; a hidden button leaves its slot empty so nothing shifts */
#atk{bottom:0}#ctx{bottom:calc(var(--atk) + 12px)}#itm{bottom:calc(var(--atk) + var(--ctx) + 24px)}
.act{pointer-events:auto;padding:0;border-radius:50%;font-weight:800;letter-spacing:.04em;color:#fff;border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.act:active{transform:scale(.94)}
#atk{width:var(--atk);height:var(--atk);font-size:15px;background-color:#c62828;background-image:linear-gradient(to top,rgba(0,0,0,.6) calc(var(--cd,0) * 100%),transparent 0)}
#atk.dis{opacity:.45}
#ctx{width:var(--ctx);height:var(--ctx);font-size:12px;background:#f9a825;color:#1b1b1b}
#ctx.hold{background:#ffd54f}
#ctx,#atk{white-space:pre-line;line-height:1.1}
#ov{position:absolute;inset:0;background:linear-gradient(#050509,#0a0610 70%,#0d0710);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;text-align:center;overflow:hidden;--glow:232,112,46;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal))}
#ov[data-k=killer],#ov[data-k=result]{--glow:200,20,30}#ov[data-k=survivor]{--glow:150,110,210}
#ov::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 42% at 50% 112%,rgba(var(--glow),.42),rgba(var(--glow),.14) 48%,transparent 72%),radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.88) 100%);animation:ovBreath 5s ease-in-out infinite}
#ov::after{content:'';position:absolute;inset:-40px;pointer-events:none;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:ovGrain .5s steps(4) infinite}
#ov>div{position:relative;z-index:1}
#ovT,#ovS,#ovM,#ovN{font-family:Georgia,'Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif}
#ovT{max-width:94vw;font-size:min(6.6vw,11dvh,50px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-wrap:balance;line-height:1.15;text-shadow:0 0 .3em currentColor,0 0 1em rgba(var(--glow),.75),0 3px 0 rgba(0,0,0,.8);animation:ovIn 1.1s cubic-bezier(.2,.7,.2,1) both,ovFlick 6s linear 1.2s infinite}
#ovT::after{content:'';display:block;width:min(62%,340px);height:2px;margin:.6em auto 0;background:linear-gradient(90deg,transparent,currentColor 30%,currentColor 70%,transparent);opacity:.75;box-shadow:0 0 12px currentColor}
#ovS{font-size:min(16vw,22dvh,96px);font-weight:700;line-height:1;color:#e9dccb;text-shadow:0 0 .25em rgba(var(--glow),.9),0 0 .9em rgba(var(--glow),.6);animation:ovBeat 1s ease-in-out infinite}
#ovS:empty{display:none}
#ovM{font-size:min(4.6vw,6.6dvh,21px);font-style:italic;letter-spacing:.08em;color:#cdbfae;opacity:.9;white-space:pre-line;text-shadow:0 2px 8px #000;animation:ovIn 1.4s .3s both}
#ovN{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;color:#b9aa98}
#ovM:empty,#ovN:empty{display:none}
@keyframes ovIn{from{opacity:0;filter:blur(10px);transform:scale(1.08)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ovFlick{0%,89%,93%,97%,100%{opacity:1}91%{opacity:.5}95%{opacity:.78}}
@keyframes ovBeat{0%,100%{transform:scale(1)}10%{transform:scale(1.13)}20%{transform:scale(1)}32%{transform:scale(1.07)}44%{transform:scale(1)}}
@keyframes ovBreath{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes ovGrain{0%{transform:translate(0,0)}25%{transform:translate(-14px,9px)}50%{transform:translate(11px,-12px)}75%{transform:translate(-7px,-6px)}100%{transform:translate(0,0)}}
/* ---------- character select (cosmetic) ---------- */
#sel{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(6px,1.4dvh,12px);text-align:center;overflow:hidden;touch-action:none;--glow:200,20,30;font-family:"Courier New",ui-monospace,monospace;background:linear-gradient(#04051a,#080a24 60%,#0d0710);padding:calc(var(--sat) + var(--bar) + 2px) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal))}
#sel.in{animation:selIn .45s ease-out both}
@keyframes selIn{from{opacity:0}to{opacity:1}}
#sel::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 42% at 50% 112%,rgba(var(--glow),.42),rgba(var(--glow),.14) 48%,transparent 72%),radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.88) 100%);animation:ovBreath 5s ease-in-out infinite}
#sel::after{content:'';position:absolute;inset:-40px;pointer-events:none;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:ovGrain .5s steps(4) infinite}
#sel>div{position:relative;z-index:1;max-width:100%}
#sel.calm::after,#sel.calm #selT,#sel.calm::before{animation:none}
#selT{font-weight:900;font-size:clamp(16px,min(5.2vw,7dvh),34px);letter-spacing:.12em;text-transform:uppercase;color:#f4efff;text-shadow:2px 2px 0 #b3121a,4px 4px 0 #3a060b,0 0 22px rgba(214,24,36,.5);animation:ovFlick 6s linear 1.2s infinite}
#selTag{color:#ff6b73;letter-spacing:.3em;font-size:clamp(9px,1.8dvh,11px);text-transform:uppercase;margin-top:4px}
#selCd{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(100%,420px)}
#selN{font-size:clamp(26px,min(11vw,9dvh),56px);font-weight:900;line-height:1;color:#e9dccb;text-shadow:0 0 .25em rgba(var(--glow),.9),0 0 .9em rgba(var(--glow),.6);animation:ovBeat 1s ease-in-out infinite}
#selBar{width:100%;height:4px;background:#1a0a10;border:1px solid #4e090e;border-radius:2px;overflow:hidden}
#selBar i{display:block;height:100%;background:linear-gradient(90deg,#b3121a,#ff4f57);transform-origin:left;box-shadow:0 0 8px #ff4f57}
#selCards{--cols:4;--gap:10px;flex:1 1 auto;min-height:0;width:min(100%,1080px);display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:var(--gap);padding:8px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#selCards.k{--cols:3}
#selCards>.sc{flex:0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));max-width:190px}
@media (min-width:900px){#selCards:not(.k){--cols:8}#selCards.k{--cols:5}}
@media (orientation:portrait) and (max-width:560px){#selCards{--cols:3;--gap:8px}#selCards.k{--cols:2}}
.sc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;min-height:96px;background:rgba(5,7,22,.82);border:2px solid #2b3584;border-radius:4px;box-shadow:0 0 0 2px #04051a,0 0 0 4px #6e1119;opacity:.62;filter:saturate(.6);cursor:pointer;touch-action:pan-y;transition:opacity .15s,filter .15s,transform .06s}
.sc.on{opacity:1;filter:none;border-color:var(--cc);box-shadow:0 0 0 2px #04051a,0 0 0 4px var(--cc),0 0 22px var(--cc)}
.sc:active{transform:translateY(2px)}.sc.lk{cursor:default}
.sc canvas{height:clamp(64px,13dvh,112px);width:auto;max-width:100%;object-fit:contain;image-rendering:pixelated}
.sc b{font-size:clamp(12px,2.2dvh,15px);line-height:1.15;text-align:center;overflow-wrap:anywhere;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#f4efff}
.sc small{color:#ff6b73;letter-spacing:.1em;font-size:clamp(10px,1.8dvh,12px);line-height:1.25;text-align:center;text-transform:none;letter-spacing:.04em;text-transform:uppercase;opacity:1}
.sc em{font-style:normal;font-size:11px;letter-spacing:.14em;color:#69f0ae;font-weight:900;min-height:12px}
.sc u{position:absolute;left:4px;top:4px;text-decoration:none;font-size:10px;font-weight:900;background:#fff;color:#04051a;padding:1px 5px;border-radius:2px}
.sc .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:18px;padding-left:30px;padding-right:2px}
.sc .dots i{width:17px;height:17px;border-radius:50%;border:1px solid #04051a;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;font-weight:900;color:#04051a;line-height:1}
#selAct{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:min(100%,520px)}
#selLock{font-family:"Courier New",ui-monospace,monospace;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:#fff;width:100%;font-size:18px;min-height:56px;padding:0 22px;border:2px solid #ff4f57;border-radius:3px;background:#b3121a;box-shadow:0 4px 0 #4e090e,0 0 14px rgba(214,24,36,.35);transition:transform .06s;touch-action:manipulation}
#selLock:active{transform:translateY(3px);box-shadow:0 1px 0 #4e090e}#selLock:disabled{opacity:.45}
#selWait{color:#a9b3ee;font-size:clamp(12px,2dvh,14px);letter-spacing:.06em}
#selReady{flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;width:min(100%,680px);max-height:52px;overflow-y:auto;touch-action:pan-y}
.sch{font-family:"Courier New",ui-monospace,monospace;font-weight:700;background:rgba(8,12,40,.9);border-radius:2px}
.sch span{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
#selReady .si{padding:2px 8px;font-size:12px;line-height:18px;border-radius:11px}#selReady .si i{width:10px;height:10px}#selReady .si b{font-size:12px}
#selH,#selCd,#selAct,#selReady{flex:none}
#selN{font-size:clamp(24px,min(9vw,6dvh),48px)}
@media (max-height:640px) and (orientation:portrait){#selTag{display:none}}
@media (max-height:420px){#selTag{display:none}}
/* landscape phones: left pane = title / countdown / lock-in / ready chips, right pane = scrollable character grid */
@media (orientation:landscape) and (max-height:520px){

<script>

/* ================= CONFIG (all tunables here) ================= */

], iceCandidatePoolSize: 4 } };

  DOOR_SURV_BREAK_MS: 3000,            // a barricade can be broken by SURVIVORS too (BREAK button) once it has stood this long since it was built (the killer can break it from DOOR_ARM_MS on, as before)

  NM_SURV_MS: 5250, NM_KILLER_MS: 12000, NM_VIS: .65,   // (duration +35%; the exposed side's vision x NM_VIS = -35%) Nightmare Fuel: used by a survivor = killer revealed + terror trail for NM_SURV_MS; used by the killer = survivors revealed + terror trail for NM_KILLER_MS
  TERROR_STEP: 28, TERROR_MAX: 40, TERROR_HOLD_MS: 2200, TERROR_FADE_MS: 1800,

  TRAP_R: 30, TRAP_R_K: 45, SURV_ITEM_MULT: 0.75,   // TRAP_R_K = killer-set trap radius (+50%) / SURV_ITEM_MULT = survivor-used trap root, slick slide and flashbang blind time x this (-25%)
  TRAP_ROOT_MS: 3750, TRIG_ALERT_MS: 4000, TRAP_LIFE_MS: 90000, SET_HIDE_MS: 1000,   // bear trap: trigger radius / root time / the other side sees traps + slicks only this long after they are set
  SLICK_R: 48, SLICK_R_K: 72,   // SLICK_R_K = killer-set slick radius (+50%)

  r.setProperty('--jbase', CFG.JOY_BASE + 'px'); r.setProperty('--jknob', CFG.JOY_KNOB + 'px'); r.setProperty('--zw', CFG.JOY_ZONE_W * 100 + '%'); r.setProperty('--zh', CFG.JOY_ZONE_H * 100 + '%');
  readInsets();
})();
$('testN').onclick = () => {   // test room: cycle the room size 2..MAX_PLAYERS (you + bots)
  if (!S.test || S.role !== 'host' || S.started) return;
  const n = HP.size >= CFG.MAX_PLAYERS ? 2 : HP.size + 1;
  while (HP.size > n) { const b = [...HP.values()].reverse().find(q => q.bot); if (!b) break; HP.delete(b.id); }
  while (HP.size < n) { const b = addPlayer('Bot ' + (++botN), null, undefined, false); b.bot = true; }
  pushRoster(); refreshUI();
};
$('testBtn').onclick = startTestRoom; $('testDiff').onclick = () => { botLevel = (botLevel + 1) % BOT_LEVELS.length; store.set('dotsBotLvl', botLevel); refreshUI(); }; document.querySelectorAll('#testRole button').forEach(b => b.onclick = () => { S.testRole = b.dataset.r; refreshUI(); });
$('create').onclick = createRoom; $('join').onclick = joinRoom; $('cancelJoin').onclick = () => resetToMenu(''); $('leaveL').onclick = leave; $('backT').onclick = leave; $('start').onclick = startGame;
if (DEBUG) { const b = document.createElement('button'); b.id = 'addBot'; b.className = 'sec hidden'; b.textContent = 'Add test dot'; b.onclick = addBot; $('start').after(b); }
$('menuBtn').onclick = () => menuOpen($('menuPanel').classList.contains('hidden'));
$('menuBack').addEventListener('pointerdown', e => { e.preventDefault(); menuOpen(false); });
$('mMute').onclick = () => { muted = !muted; store.set('dotsMuted', muted ? '1' : '0'); audioInit(); refreshMenu(); };
$('mAmb').onclick = () => { AMB.enabled = !AMB.enabled; store.set('dotsAmb', AMB.enabled ? '1' : '0'); audioInit(); refreshMenu(); };
$('mFull').onclick = () => { try { if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { const p = fsReq.call(document.documentElement); if (p && p.catch) p.catch(() => {}); } } catch (e) {} menuOpen(false); };
$('mFx').onclick = () => { reduceFx = !reduceFx; store.set('dotsReduceFx', reduceFx ? '1' : '0'); if (reduceFx) JUICE.shakeEnd = 0; refreshMenu(); };
$('mBright').onclick = () => { brightIdx = (brightIdx + 1) % CFG.BRIGHT_LEVELS.length; store.set('dotsBright', brightIdx); applyBright(); refreshMenu(); };
$('mMap').onclick = () => { MM.on = !MM.on; store.set('dotsMinimap', MM.on ? '1' : '0'); refreshMenu(); };
$('mTasks').onclick = () => { menuOpen(false); if (S.role === 'host' && S.started && S.phase === 'hunt') tsFinishSet(); };   // debug: instantly complete the current set
$('tQuit').onclick = taskQuit;
bindBtn($('itm'), () => { audioInit(); if (S.item) sendAct('item', true); });
$('mGenFix').onclick = () => { menuOpen(false); dbgFixNextGen(); }; $('mGenKick').onclick = () => { menuOpen(false); dbgKickNearest(); };   // debug only (the buttons are hidden without ?debug=1)
addEventListener('resize', () => { if (TK && TK.relayout) TK.relayout(); }); addEventListener('orientationchange', () => setTimeout(() => { if (TK && TK.relayout) TK.relayout(); }, 300));
$('mEnd').onclick = () => askConfirm('end'); $('mLeave').onclick = () => askConfirm('leave');
$('cfYes').onclick = () => { const k = pendingConfirm; closeConfirm(); if (k === 'leave') leave(); else if (k === 'end') endRound('Round ended'); };
$('cfNo').onclick = closeConfirm;
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, audioInit, { passive: true }));   // safety net: resume audio on any first interaction
if (DEBUG) { const e = document.createElement('div'); e.id = 'dbgG'; $('under').append(e); }
applyBright();
const codeTap = () => { copy(S.code); $('codeHint').textContent = 'Copied!'; clearTimeout(codeTap.h); codeTap.h = setTimeout(() => $('codeHint').textContent = S.test ? 'Test room (offline)' : 'Room code (tap to copy)', 1200); };
$('code').onclick = codeTap; $('code').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') codeTap(); });
$('invite').onclick = () => { copy(location.origin + location.pathname + '?room=' + S.code); $('invite').textContent = 'Copied!'; setTimeout(() => $('invite').textContent = 'Copy invite link', 1200); };
$('joinCode').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().split('').filter(c => CODE_CHARS.includes(c)).join('').slice(0, 5); T.warm(); });
$('name').value = clean(store.get('dotsName')); $('name').addEventListener('change', () => store.set('dotsName', clean($('name').value)));
try { const r = new URLSearchParams(location.search).get('room'); if (r) $('joinCode').value = r.toUpperCase().split('').filter(c => CODE_CHARS.includes(c)).join('').slice(0, 5); } catch (e) {}
setInterval(async () => { if (!$('lobby').classList.contains('hidden')) $('dbg').textContent = await T.route(); }, 2000);

/* ---- ?layout=1: draws the safe areas and every control's hit zone (red = smaller than CFG.BTN_MIN) ---- */
if (/[?&]layout=1(&|$)/.test(location.search)) {
  const o = document.createElement('div'); o.id = 'lay'; o.innerHTML = '<i class="sa st"></i><i class="sa sb"></i><i class="sa sl"></i><i class="sa sr"></i><div id="layInfo"></div>'; document.body.append(o);
  const IDS = ['topbar', 'menuBtn', 'under', 'zone', 'hint', 'acts', 'atk', 'ctx', 'menuPanel', 'mMute', 'mFull', 'mEnd', 'mLeave', 'cfYes', 'cfNo', 'create', 'join', 'joinCode', 'name', 'code', 'invite', 'start', 'leaveL', 'plist'];
  const lay = () => { readInsets(); o.querySelectorAll('.hz').forEach(n => n.remove());
    IDS.forEach(id => { const el = $(id); if (!el || !el.getClientRects().length) return; const r = el.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
      const small = /^(BUTTON|INPUT)$/.test(el.tagName) && (r.width < CFG.BTN_MIN - .5 || r.height < CFG.BTN_MIN - .5), d = document.createElement('div');
      d.className = 'hz' + (small ? ' bad' : ''); d.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`; d.dataset.l = `${id} ${Math.round(r.width)}×${Math.round(r.height)}`; o.append(d); });
    $('layInfo').textContent = `${innerWidth}×${innerHeight} @${(window.devicePixelRatio || 1).toFixed(1)}x · safe t${INS.t} r${INS.r} b${INS.b} l${INS.l}`; };
  setInterval(lay, 400); addEventListener('resize', lay); lay();
}

// Load PeerJS from CDN with fallbacks, then warm up the signalling connection.
const PEER_URLS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
function loadPeer(i = 0) { return new Promise((res, rej) => { if (window.Peer) return res(); if (i >= PEER_URLS.length) return rej();
  const s = document.createElement('script'); s.crossOrigin = 'anonymous'; s.src = PEER_URLS[i];   // crossOrigin => browsers show real PeerJS error text instead of "Script error."
  s.onload = () => res(); s.onerror = () => { s.remove(); loadPeer(i + 1).then(res, rej); }; document.head.append(s); }); }
try { bgBuild(); bgShow(true); } catch (e) { console.warn('bg', e); }
busy(true); $('mStatus').textContent = 'Loading network library…';
loadPeer().then(() => { netReady = true; busy(false); $('mStatus').textContent = ''; T.warm(); },
  () => { $('mStatus').textContent = 'Could not load the network library. Check your connection and reload.'; });
